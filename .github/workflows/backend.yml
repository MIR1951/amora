name: Backend tests

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/requirements.lock
            backend/requirements-dev.txt
      # Avval serverdagi bilan aynan bir xil versiyalar (xeshlari bilan), keyin test vositalari
      - run: pip install --require-hashes -r requirements.lock
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
      - name: Kod tekshiruvi (ruff)
        run: |
          pip install "ruff==0.17.6"
          ruff check .

  # Xuddi shu testlar haqiqiy PostgreSQL'da: jonli yangilanishlar (NOTIFY/LISTEN) faqat shu yerda
  # to'liq tekshiriladi, serverda ham aynan PostgreSQL ishlaydi.
  test-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: amora
          POSTGRES_PASSWORD: amora
          POSTGRES_DB: amora_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U amora"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://amora:amora@localhost:5432/amora_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/requirements.lock
            backend/requirements-dev.txt
      # Avval serverdagi bilan aynan bir xil versiyalar (xeshlari bilan), keyin test vositalari
      - run: pip install --require-hashes -r requirements.lock
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
      # Migratsiyalar alohida, toza bazada: testlar jadvallarni modeldan yaratadi, shuning uchun
      # yetishmayotgan yoki xato migratsiyani faqat shu qadam ushlaydi
      - name: Migratsiyalar modelga mosligi
        env:
          PGPASSWORD: amora
          AMORA_DATABASE_URL: postgresql+asyncpg://amora:amora@localhost:5432/amora_migrations
        run: |
          psql -h localhost -U amora -d amora_test -c "CREATE DATABASE amora_migrations"
          alembic upgrade head
          alembic check

  # Serverga qo'yiladigan image yig'ilishini tekshiradi (buzilgan Dockerfile serverda emas, shu yerda chiqadi)
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t amora-backend backend
      - run: docker run --rm amora-backend python -c "import app.main, app.bot, app.menu_content"
