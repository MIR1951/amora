name: iOS TestFlight

# Imzolangan iOS ilovani yig'ib, App Store Connect'ga (TestFlight) yuklaydi.
# Faqat qo'lda ishga tushadi: Actions → "iOS TestFlight" → Run workflow.
#
# Kerakli sirlar (Settings → Secrets and variables → Actions):
#   APPLE_TEAM_ID   - Apple Developer Team ID (10 belgi)
#   ASC_KEY_ID      - App Store Connect API kalitining Key ID si
#   ASC_ISSUER_ID   - App Store Connect API Issuer ID
#   ASC_KEY_P8      - .p8 faylning to'liq matni (BEGIN/END qatorlari bilan)
#
# Imzo: har safar vaqtinchalik "Apple Distribution" sertifikati va App Store profili yaratiladi
# va ish oxirida o'chiriladi (ios/ci/asc.py). Mac ham, saqlab qo'yilgan sertifikat ham kerak emas.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-testflight
  cancel-in-progress: false

env:
  BUNDLE_ID: uz.amora.app

jobs:
  upload:
    name: Yig'ish, imzolash va TestFlight'ga yuklash
    # Faqat main shoxidan: boshqa shoxdagi o'zgartirilgan skript sirlarni ishlata olmasin
    if: github.repository == 'MIR1951/amora' && github.ref == 'refs/heads/main'
    # Sirlarni shu muhitga ko'chirib, unga tasdiqlovchi qo'yish mumkin:
    # Settings → Environments → testflight → Required reviewers
    environment: testflight
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # Kutubxonalar App Store Connect kaliti diskka yozilishidan OLDIN va qulflangan versiyalarda
      # (xeshlari bilan) o'rnatiladi: begona paket kalitni o'qiy olmasligi kerak
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Python kutubxonalari (pyjwt va cryptography shu ro'yxat ichida)
        run: pip install --require-hashes -r backend/requirements.lock

      - name: Sirlarni tekshirish
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          MISSING=""
          for NAME in APPLE_TEAM_ID ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8; do
            if [ -z "${!NAME}" ]; then MISSING="$MISSING $NAME"; fi
          done
          if [ -n "$MISSING" ]; then
            echo "::error::GitHub sirlari qo'yilmagan:$MISSING (Settings → Secrets and variables → Actions)"
            exit 1
          fi
          TEAM=$(printf '%s' "$APPLE_TEAM_ID" | tr -d '[:space:]')
          if ! printf '%s' "$TEAM" | grep -Eq '^[A-Z0-9]{10}$'; then
            echo "::error::APPLE_TEAM_ID 10 ta katta harf/raqamdan iborat bo'lishi kerak"
            exit 1
          fi
          KEY_ID=$(printf '%s' "$ASC_KEY_ID" | tr -d '[:space:]')
          echo "TEAM_ID=$TEAM" >> "$GITHUB_ENV"
          echo "ASC_KEY_ID=$KEY_ID" >> "$GITHUB_ENV"
          echo "ASC_ISSUER_ID=$(printf '%s' "$ASC_ISSUER_ID" | tr -d '[:space:]')" >> "$GITHUB_ENV"
          # Kalit fayli: asc.py va altool shu yerdan o'qiydi (altool ~/.appstoreconnect/private_keys ni qidiradi)
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          KEY_PATH="$HOME/.appstoreconnect/private_keys/AuthKey_$KEY_ID.p8"
          printf '%s\n' "$ASC_KEY_P8" | tr -d '\r' > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          echo "ASC_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"
          echo "SIGNING=$RUNNER_TEMP/signing" >> "$GITHUB_ENV"
          echo "LOGS=$RUNNER_TEMP/logs" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/logs"

      - name: App Store Connect'ni tekshirish (bundle ID, push, ilova yozuvi)
        id: check
        run: python ios/ci/asc.py check --bundle-id "$BUNDLE_ID" --min-build "${{ github.run_number }}"

      - name: Xcode 26 ni tanlash
        run: bash ios/ci/select_xcode.sh

      - name: Xcode loyihasini yaratish (XcodeGen)
        run: |
          brew install xcodegen
          cd ios
          xcodegen generate

      - name: Vaqtinchalik sertifikat va profil
        id: signing
        run: python ios/ci/asc.py signing --bundle-id "$BUNDLE_ID" --out "$SIGNING"

      - name: Sertifikatni vaqtinchalik keychain'ga qo'yish
        env:
          P12_PASSWORD: ${{ steps.signing.outputs.p12_password }}
          PROFILE_UUID: ${{ steps.signing.outputs.profile_uuid }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/amora-signing.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -base64 24)
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          # Apple'ning oraliq sertifikati (WWDR G3): imzo zanjiri to'liq bo'lsin
          curl -fsSL -o "$SIGNING/AppleWWDRCAG3.cer" https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer \
            && security import "$SIGNING/AppleWWDRCAG3.cer" -k "$KEYCHAIN" -T /usr/bin/codesign || true
          security import "$SIGNING/dist.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" -f pkcs12 \
            -T /usr/bin/codesign -T /usr/bin/security -T /usr/bin/productbuild
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$KEYCHAIN"
          rm -f "$SIGNING/dist.p12"
          # Xcode 16+ profillarni yangi joydan, eskilari eski joydan o'qiydi: ikkalasiga ham
          for DIR in "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles" \
                     "$HOME/Library/MobileDevice/Provisioning Profiles"; do
            mkdir -p "$DIR"
            cp "$SIGNING/profile.mobileprovision" "$DIR/$PROFILE_UUID.mobileprovision"
          done
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

      - name: Arxiv (Release, imzolangan)
        env:
          BUILD_NUMBER: ${{ steps.check.outputs.build_number }}
          PROFILE_NAME: ${{ steps.signing.outputs.profile_name }}
        run: |
          set -o pipefail
          ARGS=(archive
            -project ios/Amora.xcodeproj -scheme Amora
            -configuration Release
            -destination "generic/platform=iOS"
            -archivePath "$RUNNER_TEMP/Amora.xcarchive"
            DEVELOPMENT_TEAM="$TEAM_ID"
            CODE_SIGN_STYLE=Manual
            CODE_SIGN_IDENTITY="Apple Distribution"
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME"
            OTHER_CODE_SIGN_FLAGS="--keychain $KEYCHAIN"
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER")
          xcodebuild "${ARGS[@]}" > "$LOGS/xcodebuild-archive.log" 2>&1 || STATUS=$?
          tail -n 5 "$LOGS/xcodebuild-archive.log"
          if [ "${STATUS:-0}" != 0 ]; then
            echo "::group::Xatolar"
            grep -E 'error:|\*\* ARCHIVE FAILED' "$LOGS/xcodebuild-archive.log" | sort -u | head -n 200 || true
            echo "::endgroup::"
            exit "$STATUS"
          fi
          APP="$RUNNER_TEMP/Amora.xcarchive/Products/Applications/Amora.app"
          test -d "$APP"
          # TestFlight'ga faqat haqiqiy serverga qaragan, push'li ilova chiqadi
          test "$(/usr/libexec/PlistBuddy -c "Print :AmoraApiBaseUrl" "$APP/Info.plist")" = "https://amora.mirjoy.uz"
          test "$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$APP/Info.plist")" = "$BUILD_NUMBER"
          # Faqat iPhone (UIDeviceFamily = [1])
          test "$(/usr/libexec/PlistBuddy -c "Print :UIDeviceFamily:0" "$APP/Info.plist")" = "1"
          if /usr/libexec/PlistBuddy -c "Print :UIDeviceFamily:1" "$APP/Info.plist" 2>/dev/null; then
            echo "::error::Ilova iPad uchun ham yig'ilgan (TARGETED_DEVICE_FAMILY)"; exit 1
          fi
          codesign -d --entitlements - --xml "$APP" > "$LOGS/entitlements.plist" 2>/dev/null
          cat "$LOGS/entitlements.plist"
          test "$(/usr/libexec/PlistBuddy -c "Print :aps-environment" "$LOGS/entitlements.plist")" = "production"
          echo "VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP/Info.plist")" >> "$GITHUB_ENV"

      - name: IPA tayyorlash
        env:
          PROFILE_NAME: ${{ steps.signing.outputs.profile_name }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict><key>$BUNDLE_ID</key><string>$PROFILE_NAME</string></dict>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          PLIST
          set -o pipefail
          plutil -lint "$RUNNER_TEMP/ExportOptions.plist"
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Amora.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" 2>&1 | tee "$LOGS/xcodebuild-export.log" | tail -n 30
          ls -lh "$RUNNER_TEMP/export"
          IPA=$(ls "$RUNNER_TEMP"/export/*.ipa | head -n 1)
          test -f "$IPA"
          echo "IPA=$IPA" >> "$GITHUB_ENV"

      - name: TestFlight'ga yuklash
        run: |
          set -o pipefail
          xcrun altool --upload-app --type ios --file "$IPA" \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID" --output-format normal 2>&1 \
            | tee "$LOGS/altool.log"
          if grep -qiE 'error|failed' "$LOGS/altool.log" && ! grep -qiE 'No errors uploading|UPLOAD SUCCEEDED' "$LOGS/altool.log"; then
            echo "::error::Yuklashda xato: jurnalga qarang"
            exit 1
          fi

      - name: Natija
        env:
          BUILD_NUMBER: ${{ steps.check.outputs.build_number }}
        run: |
          {
            echo "### Amora iOS $VERSION ($BUILD_NUMBER) App Store Connect'ga yuklandi"
            echo
            echo "Apple uni 5–30 daqiqada qayta ishlaydi. Keyin App Store Connect → Apps → Amora → TestFlight"
            echo "bo'limida ko'rinadi. Internal Testing guruhidagi sinovchilarga TestFlight ilovasi orqali keladi."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Tozalash (vaqtinchalik sertifikat, profil, keychain, kalit)
        if: always()
        run: |
          if [ -n "${ASC_KEY_PATH:-}" ] && [ -f "$ASC_KEY_PATH" ]; then
            python ios/ci/asc.py cleanup --out "$SIGNING" || true
          fi
          if [ -n "${KEYCHAIN:-}" ]; then security delete-keychain "$KEYCHAIN" || true; fi
          rm -rf "$SIGNING" "$HOME/.appstoreconnect" \
            "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles" \
            "$HOME/Library/MobileDevice/Provisioning Profiles"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ios-testflight-logs
          path: ${{ runner.temp }}/logs
          if-no-files-found: warn
          retention-days: 14
