name: Android APK

on:
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: APK yig'ish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      # Ikki xil APK: mijozlar uchun (release, haqiqiy serverga qaratilgan) va emulyator sinovi uchun
      # (debug, shu ishning o'zida ko'tariladigan sinov serveriga qaratilgan).
      - name: Testlar va APK
        run: >
          ./gradlew --no-daemon --stacktrace
          testReleaseUnitTest assembleRelease assembleDebug
          -Pamora.versionCode=${{ github.run_number }}
          -Pamora.debugApiBaseUrl=http://10.0.2.2:8000
      - name: APK fayllarni nomlash
        run: |
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/amora-${{ github.run_number }}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/amora-sinov-${{ github.run_number }}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: amora-apk
          path: ${{ runner.temp }}/amora-${{ github.run_number }}.apk
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: amora-e2e-apk
          path: ${{ runner.temp }}/amora-sinov-${{ github.run_number }}.apk
          if-no-files-found: error
          retention-days: 3

  # Ikki sinov. Birinchisi mijozlar oladigan APK'ni haqiqiy server bilan ochadi, lekin buyurtma
  # bermaydi. Ikkinchisi shu ish ichida ko'tarilgan sinov serveri bilan buyurtmaning butun yo'lini
  # bosib o'tadi: haqiqiy kafega hech narsa yuborilmaydi.
  smoke:
    name: Emulyatorda sinov
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: amora
          POSTGRES_PASSWORD: amora
          POSTGRES_DB: amora
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U amora"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Faqat shu ishning ichidagi sinov bazasi va serveri (emulyator uchun 10.0.2.2 = shu mashina)
      AMORA_DATABASE_URL: postgresql+asyncpg://amora:amora@localhost:5432/amora
      AMORA_PUBLIC_BASE_URL: http://10.0.2.2:8000
      AMORA_MEDIA_DIR: /tmp/amora-media
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: amora-apk
          path: apk/release
      - uses: actions/download-artifact@v4
        with:
          name: amora-e2e-apk
          path: apk/e2e
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Sinov serverini ishga tushirish
        working-directory: backend
        run: |
          pip install -r requirements.txt
          alembic upgrade head
          python ../android/ci/backend_ctl.py prepare
          nohup uvicorn app.main:app_factory --factory --host 0.0.0.0 --port 8000 > "$RUNNER_TEMP/backend.log" 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/api/v1/health; then exit 0; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/backend.log"
          exit 1
      - name: Emulyator uchun tezlatishni yoqish (KVM)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Ilovani emulyatorda sinash
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            python3 android/ci/smoke_test.py readonly apk/release/*.apk smoke-output/haqiqiy-server
            adb uninstall uz.amora.app
            python3 android/ci/smoke_test.py full apk/e2e/*.apk smoke-output/sinov-server
      - name: Sinov serveri jurnali
        if: always()
        run: tail -n 200 "$RUNNER_TEMP/backend.log" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-screenshots
          path: smoke-output
          if-no-files-found: warn
          retention-days: 14

  # APK va sinov rasmlarini "ci-artifacts" shoxiga yozadi: u yerdan to'g'ridan-to'g'ri
  # yuklab olish mumkin. Shox har safar qayta yoziladi, unda faqat oxirgi yig'ilgan versiya turadi.
  publish:
    name: Natijalarni saqlash
    needs: [build, smoke]
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: ci-artifacts shoxiga yozish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir publish
          cp artifacts/amora-apk/*.apk publish/amora.apk
          if [ -d artifacts/smoke-screenshots ]; then
            cp -r artifacts/smoke-screenshots publish/screenshots
          fi
          printf 'run: %s\ncommit: %s\nref: %s\nsmoke: %s\n' \
            "$GITHUB_RUN_NUMBER" "$GITHUB_SHA" "$GITHUB_REF" "${{ needs.smoke.result }}" > publish/BUILD.txt
          cd publish
          git init -q -b ci-artifacts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Build $GITHUB_RUN_NUMBER"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-artifacts
