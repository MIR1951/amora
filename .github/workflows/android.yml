name: Android APK

on:
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: APK yig'ish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Testlar va APK
        run: >
          ./gradlew --no-daemon --stacktrace
          testReleaseUnitTest assembleRelease
          -Pamora.versionCode=${{ github.run_number }}
      - name: APK faylni nomlash
        run: cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/amora-${{ github.run_number }}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: amora-apk
          path: ${{ runner.temp }}/amora-${{ github.run_number }}.apk
          if-no-files-found: error
          retention-days: 30

  smoke:
    name: Emulyatorda sinov
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: amora-apk
          path: apk
      - name: Emulyator uchun tezlatishni yoqish (KVM)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Ilovani emulyatorda ochib ko'rish
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: python3 android/ci/smoke_test.py apk/*.apk smoke-output
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-screenshots
          path: smoke-output
          if-no-files-found: warn
          retention-days: 14

  # APK va sinov rasmlarini "ci-artifacts" shoxiga yozadi: u yerdan to'g'ridan-to'g'ri
  # yuklab olish mumkin. Shox har safar qayta yoziladi, unda faqat oxirgi yig'ilgan versiya turadi.
  publish:
    name: Natijalarni saqlash
    needs: [build, smoke]
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: ci-artifacts shoxiga yozish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir publish
          cp artifacts/amora-apk/*.apk publish/amora.apk
          if [ -d artifacts/smoke-screenshots ]; then
            cp -r artifacts/smoke-screenshots publish/screenshots
          fi
          printf 'run: %s\ncommit: %s\nref: %s\nsmoke: %s\n' \
            "$GITHUB_RUN_NUMBER" "$GITHUB_SHA" "$GITHUB_REF" "${{ needs.smoke.result }}" > publish/BUILD.txt
          cd publish
          git init -q -b ci-artifacts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Build $GITHUB_RUN_NUMBER"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-artifacts
