# Ishga tushirish:  docker compose up -d --build
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: amora
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?.env faylida POSTGRES_PASSWORD yozing}
      POSTGRES_DB: amora
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U amora -d amora"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      AMORA_DATABASE_URL: postgresql+asyncpg://amora:${POSTGRES_PASSWORD}@db:5432/amora
      AMORA_MEDIA_DIR: /srv/amora/media
    volumes:
      - media:/srv/amora/media
    ports:
      # Faqat serverning o'zidan ochiq: tashqariga nginx orqali HTTPS bilan chiqariladi
      - "127.0.0.1:8000:8000"

  bot:
    build: ./backend
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started  # baza jadvallarini api yaratadi
    env_file: .env
    environment:
      AMORA_DATABASE_URL: postgresql+asyncpg://amora:${POSTGRES_PASSWORD}@db:5432/amora
      AMORA_MEDIA_DIR: /srv/amora/media
      # Firebase kaliti: serverda ~/amora/secrets/firebase.json. Fayl bo'lmasa push o'chiq
      AMORA_FIREBASE_CREDENTIALS: /srv/amora/secrets/firebase.json
      # iPhone push kaliti: serverda ~/amora/secrets/apns.p8 (Key ID va Team ID .env da). Fayl bo'lmasa o'chiq
      AMORA_APNS_KEY: /srv/amora/secrets/apns.p8
    volumes:
      # Bot saqlagan taom rasmlarini api shu yerdan tarqatadi
      - media:/srv/amora/media
      - ./secrets:/srv/amora/secrets:ro
    command: ["python", "-m", "app.bot"]

volumes:
  pgdata:
  media:
