# Ishga tushirish:  docker compose up -d --build

# Jurnallar cheklangan: aks holda ular diskni to'ldirib, PostgreSQL'ni to'xtatib qo'yadi
x-logging: &logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: amora
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?.env faylida POSTGRES_PASSWORD yozing}
      POSTGRES_DB: amora
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U amora -d amora"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging: *logging

  api:
    build: ./backend
    image: amora-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      AMORA_DATABASE_URL: postgresql+asyncpg://amora:${POSTGRES_PASSWORD}@db:5432/amora
      AMORA_MEDIA_DIR: /srv/amora/media
    volumes:
      - media:/srv/amora/media
    ports:
      # Faqat serverning o'zidan ochiq: tashqariga nginx orqali HTTPS bilan chiqariladi
      - "127.0.0.1:8000:8000"
    # Sog'lom = baza sxemasi yangilangan va server javob beryapti (bot shuni kutadi)
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 60s
    logging: *logging

  bot:
    # api bilan bitta image: ikki marta yig'ilmaydi
    image: amora-backend
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy  # baza sxemasini api yangilaydi: bot eski sxemada ishlamasin
    env_file: .env
    environment:
      AMORA_DATABASE_URL: postgresql+asyncpg://amora:${POSTGRES_PASSWORD}@db:5432/amora
      AMORA_MEDIA_DIR: /srv/amora/media
      # Firebase kaliti: serverda ~/amora/secrets/firebase.json. Fayl bo'lmasa push o'chiq
      AMORA_FIREBASE_CREDENTIALS: /srv/amora/secrets/firebase.json
      # iPhone push kaliti: serverda ~/amora/secrets/apns.p8 (Key ID va Team ID .env da). Fayl bo'lmasa o'chiq
      AMORA_APNS_KEY: /srv/amora/secrets/apns.p8
    volumes:
      # Bot saqlagan taom rasmlarini api shu yerdan tarqatadi
      - media:/srv/amora/media
      - ./secrets:/srv/amora/secrets:ro
    command: ["python", "-m", "app.bot"]
    # Bot har 30 soniyada /tmp/amora-bot-heartbeat faylini yangilaydi. 3 daqiqa yangilanmasa,
    # `docker compose ps` uni "unhealthy" deb ko'rsatadi
    healthcheck:
      test: ["CMD", "python", "-c", "import os, sys, time; sys.exit(time.time() - os.path.getmtime('/tmp/amora-bot-heartbeat') > 180)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    logging: *logging

volumes:
  pgdata:
  media:
