[project]
name = "amora-backend"
version = "0.1.0"
description = "Amora kafe yetkazib berish xizmati: API va Telegram bot"
requires-python = ">=3.11"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
# Faqat haqiqiy xatolar: sintaksis, aniqlanmagan nomlar, ishlatilmagan importlar va o'zgaruvchilar
select = ["E4", "E7", "E9", "F"]
