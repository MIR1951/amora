# XcodeGen loyihasi: `cd ios && xcodegen generate` -> Amora.xcodeproj (repoda saqlanmaydi).
# Ilova kodi Amora/ ichida; shriftlar (Resources/Fonts/*.ttf), Assets.xcassets va OFL litsenziya
# matnlari o'z turiga qarab avtomatik "Copy Bundle Resources" bosqichiga tushadi.
# Info.plist `info:` dan yaratiladi (Amora/Resources/Info.plist, qo'lda tahrirlanmaydi).
name: Amora

options:
  bundleIdPrefix: uz.amora
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: 1
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    # Asset katalogidan avtomatik Swift nomlari (Color.accent, ImageResource.icBack, ...) yaratilmaydi:
    # ular ekranlardagi nomlar bilan to'qnashmasin. Rasmlar AppIcon enum orqali nomi bilan olinadi.
    ASSETCATALOG_COMPILER_GENERATE_ASSET_SYMBOLS: NO
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: NO
  configs:
    Debug:
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
    Release:
      SWIFT_OPTIMIZATION_LEVEL: "-O"

targets:
  Amora:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Amora
    settings:
      base:
        PRODUCT_NAME: Amora
        PRODUCT_BUNDLE_IDENTIFIER: uz.amora.app
        # Pastdagi postBuildScripts skripti yig'ilgan Info.plist'ni o'zgartiradi
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        # Faqat iPhone. XcodeGen ilova uchun standart "1,2" (iPhone+iPad) qo'yadi va u loyiha darajasidagi
        # qiymatni bosib ketadi: iPad bo'lsa Apple faqat portret yo'nalishli ilovani qabul qilmaydi
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # Server manzili. CI sinov yig'ishida (Debug): AMORA_API_BASE_URL=http://127.0.0.1:8000
        AMORA_API_BASE_URL: https://amora.mirjoy.uz
        SWIFT_EMIT_LOC_STRINGS: NO
      configs:
        # Push (APNs): Debug Xcode'dan o'rnatilganda sinov serveri, TestFlight/App Store'da asosiy server
        Debug:
          APS_ENVIRONMENT: development
        Release:
          APS_ENVIRONMENT: production
    # Mijozlarga chiqadigan (Release) ilovada shifrlanmagan mahalliy tarmoq istisnosi bo'lmaydi.
    # Info.plist bitta fayldan yaratiladi, shuning uchun kalit yig'ilgan ilovadan olib tashlanadi
    # (imzolashdan oldin). Olib tashlanmasa, yig'ish xato bilan to'xtaydi.
    postBuildScripts:
      - name: Release - mahalliy tarmoq istisnosini olib tashlash
        basedOnDependencyAnalysis: false
        inputFiles:
          - $(TARGET_BUILD_DIR)/$(INFOPLIST_PATH)
        script: |
          set -e
          if [ "${CONFIGURATION}" = "Debug" ]; then
            exit 0
          fi
          PLIST="${TARGET_BUILD_DIR}/${INFOPLIST_PATH}"
          /usr/libexec/PlistBuddy -c "Delete :NSAppTransportSecurity" "$PLIST" 2>/dev/null || true
          if /usr/libexec/PlistBuddy -c "Print :NSAppTransportSecurity" "$PLIST" >/dev/null 2>&1; then
            echo "error: NSAppTransportSecurity Release ilovasidan olib tashlanmadi"
            exit 1
          fi
    entitlements:
      path: Amora/Resources/Amora.entitlements
      properties:
        aps-environment: $(APS_ENVIRONMENT)
    info:
      path: Amora/Resources/Info.plist
      properties:
        CFBundleDisplayName: Amora
        CFBundleName: Amora
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: uz
        LSRequiresIPhoneOS: true
        AmoraApiBaseUrl: $(AMORA_API_BASE_URL)
        UIAppFonts:
          - bricolage_bold.ttf
          - bricolage_regular.ttf
          - instrument_bold.ttf
          - instrument_regular.ttf
        NSLocationWhenInUseUsageDescription: Yetkazish manzilini aniqlash uchun joylashuvingiz kerak
        LSApplicationQueriesSchemes:
          - tg
        # Mahalliy sinov serveri (http://127.0.0.1:8000) uchun. Faqat Debug yig'ishda qoladi: Release'da
        # pastdagi postBuildScripts bu kalitni Info.plist'dan olib tashlaydi
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # Android'dagi kabi: ochilishda asosiy qizil rang ustida oq logotip
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchLogo
          UIImageRespectsSafeAreaInsets: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSupportsIndirectInputEvents: true
        ITSAppUsesNonExemptEncryption: false
        # Xcode 26 (iOS 26 SDK) bilan yig'ilganda tizim elementlari (alert, klaviatura paneli)
        # o'zgarmasin: ilovaning o'z "shisha" dizayni bor va u sinovdan o'tgan ko'rinishda qoladi
        UIDesignRequiresCompatibility: true

  # Tez ishlaydigan birlik sinovlari (server kerak emas): SSE o'qish, holatlar tartibi, ro'yxatlarni
  # ehtiyotkor o'qish, qidiruv matnini bir xillashtirish. Ilova ichida ishlaydi (@testable import Amora).
  AmoraTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: AmoraTests
    dependencies:
      - target: Amora
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: uz.amora.app.tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""

  AmoraUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: AmoraUITests
    dependencies:
      - target: Amora
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: uz.amora.app.uitests
        TEST_TARGET_NAME: Amora
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""

schemes:
  Amora:
    build:
      targets:
        Amora: all
        AmoraUITests: [test]
        AmoraTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - name: AmoraTests
        - name: AmoraUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
